openapi: 3.0.0
info:
  title: Qalox School Management System API
  description: |
    Comprehensive REST API for the Qalox School Management System, providing
    complete functionality for schools to manage students, teachers, classes,
    assessments, grading, and academic results.

    **Authentication:**
    - Admin endpoints: Bearer token (JWT) via `Authorization` header
    - Teacher endpoints: Bearer token (JWT) via `Authorization` header
    - Student endpoints: Bearer token (JWT) via `Authorization` header
    - Public endpoints: No authentication required

    **Base URL:** `/api`
  version: 2.0.0
  contact:
    name: Qalox Backend Team
  license:
    name: MIT

servers:
  - url: http://localhost:3000/api
    description: Development Server
  - url: https://api.qalox.com/api
    description: Production Server

tags:
  - name: Admin - Authentication
    description: Admin login and account creation
  - name: Admin - School Management
    description: School info, overview, dashboard
  - name: Admin - Students
    description: Create, read, update students and class assignments
  - name: Admin - Staff
    description: Create, manage teachers and staff assignments
  - name: Admin - Classes
    description: Create and manage classes, class groups
  - name: Admin - Campuses
    description: Campus management
  - name: Admin - Subjects
    description: Subject creation and management
  - name: Admin - Assessments
    description: CA templates, exam scheduling, broadsheet
  - name: Admin - Grading
    description: Grading scheme creation, management and remark schemes
  - name: Admin - Results
    description: Result publication, submission management, approval
  - name: Admin - Academic Setup
    description: Academic terms, sessions, calendar management
  - name: Teacher - Authentication
    description: Teacher login and profile
  - name: Teacher - Dashboard
    description: Teacher overview and statistics
  - name: Teacher - Scoring
    description: CA and exam score entry and management
  - name: Teacher - Classes & Students
    description: View assigned classes and students
  - name: Teacher - Results
    description: Result broadsheet, computation and submission
  - name: Student - Authentication
    description: Student login
  - name: Student - Dashboard
    description: Student dashboard and metrics
  - name: Student - Results
    description: View grades and academic results
  - name: Setup
    description: System setup endpoints (classes and campuses)
  - name: Public
    description: Public data endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained after login

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination

    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
      description: Number of items per page

    classId:
      name: classId
      in: path
      required: true
      schema:
        type: integer
      description: Unique class identifier

    studentId:
      name: studentId
      in: path
      required: true
      schema:
        type: integer
      description: Unique student identifier

    staffId:
      name: staffId
      in: path
      required: true
      schema:
        type: integer
      description: Unique staff identifier

    subjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: integer
      description: Unique subject identifier

    schemeId:
      name: schemeId
      in: path
      required: true
      schema:
        type: integer
      description: Unique grading scheme identifier

  schemas:
    # ==================== Authentication Schemas ====================
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@school.com
        password:
          type: string
          format: password
          minLength: 6
          example: SecurePassword123

    AdminLoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        admin:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "John Doe"
            email:
              type: string
              format: email
              example: "admin@school.com"
            role:
              type: string
              enum: [super_admin, school_admin]
              example: "school_admin"
            schoolId:
              type: integer
              example: 1
            steps:
              type: integer
              example: 0
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    TeacherLoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        teacher:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "Mrs. Jane Smith"
            email:
              type: string
              format: email
              example: "jane.smith@school.com"
            schoolId:
              type: integer
              example: 1
            registrationNumber:
              type: string
              example: "TSH001"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    StudentLoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        student:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "Chidiebere"
            surname:
              type: string
              example: "Okafor"
            email:
              type: string
              format: email
              example: "chidi@student.com"
            schoolId:
              type: integer
              example: 1
            registrationNumber:
              type: string
              example: "QXS-2026-001"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    # ==================== Admin Creation Schemas ====================
    CreateAdminRequest:
      type: object
      required:
        - email
        - password
        - name
        - role
      properties:
        email:
          type: string
          format: email
          example: admin@school.com
        password:
          type: string
          format: password
          minLength: 6
          example: SecurePassword123
        name:
          type: string
          example: "John Administrator"
        role:
          type: string
          enum: [super_admin, school_admin]
          example: "school_admin"
        schoolId:
          type: integer
          description: Required for school_admin, not allowed for super_admin
          example: 1
        campusId:
          type: integer
          description: Optional campus assignment
          example: 1
        uniqueKey:
          type: string
          description: Required for super_admin registration
          example: "unique-key-hash"

    AdminUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: "John Administrator"
        email:
          type: string
          format: email
          example: admin@school.com
        password:
          type: string
          format: password
          minLength: 6
          example: NewPassword123

    # ==================== School Schemas ====================
    SchoolSetupRequest:
      type: object
      required:
        - name
        - prefix
      properties:
        name:
          type: string
          maxLength: 255
          example: "Beacon International School"
        prefix:
          type: string
          maxLength: 10
          example: "BIS"
        email:
          type: string
          format: email
          example: "info@school.com"
        phoneNumber:
          type: string
          example: "+234 8012345678"
        address:
          type: string
          example: "123 School Street, Lagos"
        logoUrl:
          type: string
          format: binary
          description: School logo file
        stampUrl:
          type: string
          format: binary
          description: School stamp/seal file

    SchoolResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Beacon International School"
        prefix:
          type: string
          example: "BIS"
        logoUrl:
          type: string
          example: "https://api.qalox.com/api/uploads/logo.png"
        stampUrl:
          type: string
          example: "https://api.qalox.com/api/uploads/stamp.png"
        email:
          type: string
          format: email
          example: "info@school.com"
        phoneNumber:
          type: string
          example: "+234 8012345678"
        address:
          type: string
          example: "123 School Street, Lagos"
        isSuspended:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    SchoolOverviewResponse:
      type: object
      properties:
        totalStudents:
          type: integer
          example: 245
        totalTeachers:
          type: integer
          example: 18
        totalClasses:
          type: integer
          example: 12
        activeTerm:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "First Term"
        activeSession:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "2023/2024"

    # ==================== Student Schemas ====================
    CreateStudentRequest:
      type: object
      required:
        - name
        - surname
        - classId
        - academicSessionId
      properties:
        name:
          type: string
          example: "Chidiebere"
        surname:
          type: string
          example: "Okafor"
        otherNames:
          type: string
          example: "Chisom"
        gender:
          type: string
          enum: [M, F, Other]
          example: "M"
        email:
          type: string
          format: email
          example: "chidi@student.com"
        dateOfBirth:
          type: string
          format: date
          example: "2010-05-15"
        classId:
          type: integer
          example: 3
        campusId:
          type: integer
          example: 1
        classGroupId:
          type: integer
          description: Optional class group assignment
          example: 1
        guardianName:
          type: string
          example: "Mr. Okafor Chukwu"
        guardianNumber:
          type: string
          example: "+234 8012345678"
        lifestyle:
          type: string
          example: "Boarder"
        academicSessionId:
          type: integer
          example: 1
        passport:
          type: string
          format: binary
          description: Student passport/ID photo

    StudentResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Chidiebere"
        surname:
          type: string
          example: "Okafor"
        email:
          type: string
          format: email
          example: "chidi@student.com"
        registrationNumber:
          type: string
          example: "QXS-2026-001"
        gender:
          type: string
          example: "M"
        dateOfBirth:
          type: string
          format: date
          example: "2010-05-15"
        classId:
          type: integer
          example: 3
        campusId:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        passportUrl:
          type: string
          example: "https://api.qalox.com/api/uploads/passport.jpg"
        class:
          $ref: '#/components/schemas/ClassResponse'
        campus:
          $ref: '#/components/schemas/CampusResponse'
        academicSession:
          $ref: '#/components/schemas/AcademicSessionResponse'
        classGroup:
          $ref: '#/components/schemas/ClassGroupResponse'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    # ==================== Class Schemas ====================
    CreateClassRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "JSS 1A"
        customName:
          type: string
          example: "Science Stream"
        campusId:
          type: integer
          example: 1
        staffId:
          type: integer
          description: ID of teacher to assign to class
          example: 5

    ClassResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "JSS 1A"
        customName:
          type: string
          example: "Science Stream"
        schoolId:
          type: integer
          example: 1
        campusId:
          type: integer
          example: 1
        staffId:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        campus:
          $ref: '#/components/schemas/CampusResponse'
        staff:
          $ref: '#/components/schemas/StaffResponse'
        classGroups:
          type: array
          items:
            $ref: '#/components/schemas/ClassGroupResponse'
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentResponse'

    CreateClassGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Group A"

    ClassGroupResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        classId:
          type: integer
          example: 1
        name:
          type: string
          example: "Group A"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentResponse'

    # ==================== Campus Schemas ====================
    CreateCampusRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Main Campus"
        address:
          type: string
          example: "123 School Street, Lagos"
        phoneNumber:
          type: string
          example: "+234 8012345678"
        email:
          type: string
          format: email
          example: "campus@school.com"

    CampusResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Main Campus"
        schoolId:
          type: integer
          example: 1
        address:
          type: string
          example: "123 School Street, Lagos"
        phoneNumber:
          type: string
          example: "+234 8012345678"
        email:
          type: string
          format: email
          example: "campus@school.com"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    # ==================== Staff/Teacher Schemas ====================
    CreateStaffRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: "Mrs. Jane Smith"
        email:
          type: string
          format: email
          example: "jane.smith@school.com"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Female"
        phoneNumber:
          type: string
          example: "+234 8012345678"
        address:
          type: string
          example: "45 Teacher Street, Lagos"
        duty:
          type: string
          description: Role/position (e.g., Teacher, Accountant, Cleaner)
          example: "Teacher"
        nextOfKin:
          type: string
          example: "Mr. Smith John"
        dateEmployed:
          type: string
          format: date
          example: "2020-06-01"
        payroll:
          type: number
          format: decimal
          example: 150000.00
        campusId:
          type: integer
          example: 1

    StaffResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mrs. Jane Smith"
        email:
          type: string
          format: email
          example: "jane.smith@school.com"
        registrationNumber:
          type: string
          example: "TSH001"
        gender:
          type: string
          example: "Female"
        phoneNumber:
          type: string
          example: "+234 8012345678"
        address:
          type: string
          example: "45 Teacher Street, Lagos"
        duty:
          type: string
          example: "Teacher"
        nextOfKin:
          type: string
          example: "Mr. Smith John"
        dateEmployed:
          type: string
          format: date
          example: "2020-06-01"
        payroll:
          type: number
          format: decimal
          example: 150000.00
        schoolId:
          type: integer
          example: 1
        campusId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    AssignTeacherRequest:
      type: object
      required:
        - staffId
        - classId
        - subjectId
      properties:
        staffId:
          type: integer
          example: 1
        classId:
          type: integer
          example: 3
        subjectId:
          type: integer
          example: 2
        campusId:
          type: integer
          example: 1

    TeacherAssignmentResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        staffId:
          type: integer
          example: 1
        classId:
          type: integer
          example: 3
        subjectId:
          type: integer
          example: 2
        campusId:
          type: integer
          example: 1
        assignedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    # ==================== Subject Schemas ====================
    CreateSubjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Mathematics"
        code:
          type: string
          example: "MATH101"

    SubjectResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mathematics"
        code:
          type: string
          example: "MATH101"
        schoolId:
          type: integer
          example: 1
        campusId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    # ==================== Assessment Schemas ====================
    CreateCATemplateRequest:
      type: object
      required:
        - name
        - maxScore
      properties:
        name:
          type: string
          example: "CA 1"
        maxScore:
          type: integer
          example: 10
        classId:
          type: integer
          description: If provided, template applies only to this class; if null, applies school-wide
          example: 1

    CATemplateResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "CA 1"
        maxScore:
          type: integer
          example: 10
        schoolId:
          type: integer
          example: 1
        classId:
          type: integer
          nullable: true
          example: 1
        isExam:
          type: boolean
          example: false

    UpsertCAScoresRequest:
      type: object
      required:
        - caId
        - classId
        - scores
      properties:
        caId:
          type: integer
          example: 1
        classId:
          type: integer
          example: 3
        scores:
          type: array
          items:
            type: object
            required:
              - studentId
              - score
            properties:
              studentId:
                type: integer
                example: 1
              score:
                type: number
                format: decimal
                example: 8.5

    UpsertExamScoresRequest:
      type: object
      required:
        - examId
        - classId
        - scores
      properties:
        examId:
          type: integer
          example: 1
        classId:
          type: integer
          example: 3
        scores:
          type: array
          items:
            type: object
            required:
              - studentId
              - score
            properties:
              studentId:
                type: integer
                example: 1
              score:
                type: number
                format: decimal
                example: 45.0

    # ==================== Grading Schemas ====================
    CreateGradingSchemeRequest:
      type: object
      required:
        - name
        - grades
      properties:
        name:
          type: string
          example: "JSS Grading System"
        usePosition:
          type: boolean
          description: Whether to rank students (1st, 2nd, 3rd) in results
          example: true
        classIds:
          type: array
          items:
            type: integer
          description: Classes this scheme applies to
          example: [1, 2, 3]
        grades:
          type: array
          items:
            type: object
            required:
              - min
              - max
              - grade
              - remark
            properties:
              min:
                type: integer
                example: 70
              max:
                type: integer
                example: 100
              grade:
                type: string
                example: "A"
              remark:
                type: string
                example: "Excellent"

    GradingSchemeResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "JSS Grading System"
        usePosition:
          type: boolean
          example: true
        schoolId:
          type: integer
          example: 1
        campusId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        grades:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              minScore:
                type: integer
                example: 70
              maxScore:
                type: integer
                example: 100
              grade:
                type: string
                example: "A"
              remark:
                type: string
                example: "Excellent"
        classes:
          type: array
          items:
            type: object
            properties:
              classId:
                type: integer
                example: 1

    AddGradingClassesRequest:
      type: object
      required:
        - classIds
      properties:
        classIds:
          type: array
          items:
            type: integer
          example: [4, 5, 6]

    CreateRemarkSchemeRequest:
      type: object
      required:
        - name
        - rules
      properties:
        name:
          type: string
          example: "Standard Remarks"
        rules:
          type: array
          items:
            type: object
            required:
              - min
              - max
              - remark
            properties:
              min:
                type: integer
                example: 0
              max:
                type: integer
                example: 40
              remark:
                type: string
                example: "Needs Improvement"

    # ==================== Result Schemas ====================
    PublishResultsRequest:
      type: object
      required:
        - classId
        - subjectId
        - academicSessionId
      properties:
        classId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 2
        academicSessionId:
          type: integer
          example: 1
        termId:
          type: integer
          nullable: true
          example: 1

    PublishedResultResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        classId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 2
        academicSessionId:
          type: integer
          example: 1
        termId:
          type: integer
          nullable: true
        publishedByAdminId:
          type: integer
          example: 1
        publishedAt:
          type: string
          format: date-time
          example: "2024-06-15T10:30:00Z"
        rows:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              studentId:
                type: integer
                example: 1
              caTotal:
                type: number
                format: float
                example: 8.5
              examTotal:
                type: number
                format: float
                example: 45.0
              total:
                type: number
                format: float
                example: 53.5
              grade:
                type: string
                example: "B"
              remark:
                type: string
                example: "Good"
              position:
                type: integer
                nullable: true
                example: 3

    # ==================== Academic Term Schemas ====================
    CreateAcademicTermRequest:
      type: object
      required:
        - sessionId
        - name
      properties:
        sessionId:
          type: integer
          example: 1
        name:
          type: string
          example: "First Term"
        resumptionDate:
          type: string
          format: date
          example: "2024-01-15"

    AcademicTermResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        sessionId:
          type: integer
          example: 1
        name:
          type: string
          example: "First Term"
        isActive:
          type: boolean
          example: true
        resumptionDate:
          type: string
          format: date
          nullable: true
          example: "2024-01-15"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    # ==================== Academic Session Schemas ====================
    CreateAcademicSessionRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "2023/2024"

    AcademicSessionResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        name:
          type: string
          example: "2023/2024"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    # ==================== Teacher Dashboard Schemas ====================
    TeacherOverviewResponse:
      type: object
      properties:
        totalClasses:
          type: integer
          example: 3
        totalStudents:
          type: integer
          example: 95
        totalSubjects:
          type: integer
          example: 4
        pendingSubmissions:
          type: integer
          example: 2
        classesWithoutSubmission:
          type: array
          items:
            type: object
            properties:
              classId:
                type: integer
                example: 1
              className:
                type: string
                example: "JSS 1A"
              subjects:
                type: array
                items:
                  type: object
                  properties:
                    subjectId:
                      type: integer
                      example: 1
                    subjectName:
                      type: string
                      example: "Mathematics"

    # ==================== Student Dashboard Schemas ====================
    StudentDashboardMetricsResponse:
      type: object
      properties:
        totalResults:
          type: integer
          example: 12
        averageScore:
          type: number
          format: float
          example: 68.5
        currentTerm:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "First Term"
        currentSession:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "2023/2024"

    StudentResultResponse:
      type: object
      properties:
        sessionId:
          type: integer
          example: 1
        sessionName:
          type: string
          example: "2023/2024"
        termId:
          type: integer
          nullable: true
          example: 1
        termName:
          type: string
          nullable: true
          example: "First Term"
        subjects:
          type: array
          items:
            type: object
            properties:
              subjectId:
                type: integer
                example: 1
              subjectName:
                type: string
                example: "Mathematics"
              ca:
                type: number
                format: float
                example: 8.5
              exam:
                type: number
                format: float
                example: 45.0
              total:
                type: number
                format: float
                example: 53.5
              grade:
                type: string
                example: "B"
              remark:
                type: string
                example: "Good"

    # ==================== Error Schemas ====================
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "An error occurred"
        error:
          type: string
          example: "Detailed error information"
        code:
          type: string
          example: "VALIDATION_ERROR"

    NotFoundResponse:
      type: object
      properties:
        message:
          type: string
          example: "Resource not found"

    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
          example: "Unauthorized - Invalid token"

paths:
  # ==================== ADMIN AUTHENTICATION ====================
  /admin/create:
    post:
      summary: Create a new admin account
      description: Create a super_admin or school_admin account. Super admins require a valid uniqueKey.
      tags:
        - Admin - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
      responses:
        '201':
          description: Admin created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/login:
    post:
      summary: Admin login
      description: Authenticate an admin account and receive a JWT token
      tags:
        - Admin - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'

  /admin/{id}:
    put:
      summary: Update admin details
      description: Update an admin's information
      tags:
        - Admin - Authentication
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Admin ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateRequest'
      responses:
        '200':
          description: Admin updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Admin updated successfully"
                  admin:
                    $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete an admin account
      description: Delete an admin account (super_admin only)
      tags:
        - Admin - Authentication
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Admin ID
      responses:
        '200':
          description: Admin deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Admin deleted successfully"
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== SCHOOL MANAGEMENT ====================
  /school/setup:
    post:
      summary: Setup a new school
      description: Create a new school with logo and stamp files
      tags:
        - Admin - School Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SchoolSetupRequest'
      responses:
        '201':
          description: School created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "School setup successful"
                  school:
                    $ref: '#/components/schemas/SchoolResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /school:
    get:
      summary: List all schools (service-to-service)
      description: Retrieve all schools (requires service authentication)
      tags:
        - Admin - School Management
      responses:
        '200':
          description: Schools retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  schools:
                    type: array
                    items:
                      $ref: '#/components/schemas/SchoolResponse'

  /school/{id}:
    get:
      summary: Get school details
      description: Retrieve details of a specific school
      tags:
        - Admin - School Management
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: School ID
      responses:
        '200':
          description: School retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolResponse'
        '404':
          description: School not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'

