  # ==================== ADMIN STUDENTS ====================
  /admin/students:
    get:
      summary: List all students
      description: Get paginated list of students in the school
      tags:
        - Admin - Students
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: campusId
          in: query
          schema:
            type: integer
          description: Filter by campus
        - name: classId
          in: query
          schema:
            type: integer
          description: Filter by class
        - name: gender
          in: query
          schema:
            type: string
            enum: [M, F, Other]
          description: Filter by gender
        - name: name
          in: query
          schema:
            type: string
          description: Search by student name
